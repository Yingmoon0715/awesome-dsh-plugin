url: https://github.com/Yingmoon0715/yingmoon-plugins/tree/main/plugins/rightbar-driver
name: Yingmoon0715/yingmoon-plugins#plugins/rightbar-driver
category: browser
description:
  en: 'Drives the DSH right-sidebar built-in browser with 35 tools (open, navigate, read text and interactive elements, accessibility tree, click, fill, select, check, key press, scroll, screenshot, full-page screenshot, PDF, markdown export, scrape to JSON, download, cookies, per-step operation records with replay and action whitelisting), and serves the built-in web_search from a self-hosted SearXNG over an SSH tunnel so search keeps working without the metered official provider.'
  zh: '用 35 个工具驱动 DSH 右推栏内置浏览器（打开、导航、读正文与可交互元素、无障碍树、点击、填字、选下拉框、勾选、按键、滚动、截图、整页截图、导出 PDF、导出 markdown、按选择器提取 JSON、下载、Cookie 存取、带序号的操作记录与重放及动作白名单），同时把内置 web_search 接到自建 SearXNG（经 SSH 隧道），让搜索在没有官方计费通道时照常可用。'
